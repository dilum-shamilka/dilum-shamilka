    <style>
        /* 1. Initial State for Full Page Load:
           Ensures content is hidden until the script loads, then smoothly fades in. */
        body {
            opacity: 0;
            transition: opacity 1s ease-in; /* Controls the speed of the full-page fade-in */
        }

        /* 2. Initial state for all revealed elements (SLIDE-DOWN from the TOP and fade) */
        .reveal-element {
            /* Initial position: 30px ABOVE its final spot */
            transform: translateY(-30px);
            /* Starts hidden */
            opacity: 0;
            /* Define the smooth transition */
            transition: opacity 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            /* Optimization hint */
            will-change: opacity, transform;
        }

        /* 3. Final State: When the 'visible' class is added by JavaScript */
        .reveal-element.visible {
            /* Final position: back to normal (0 offset) */
            transform: translateY(0);
            /* Fully visible */
            opacity: 1;
        }
    </style>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Initial Page Fade-in:
        // Sets the body opacity to 1, triggering the CSS transition for a smooth page load.
        document.body.style.opacity = '1';

        // 2. Set up the Intersection Observer for all scroll-reveal elements
        // Target all elements with the new standardized class 'reveal-element'
        const elementsToReveal = document.querySelectorAll('.reveal-element');

        // Configuration for the Intersection Observer
        const observerOptions = {
            // Trigger animation 100px before the bottom of the element hits the bottom of the viewport.
            rootMargin: '0px 0px -100px 0px',
            threshold: 0.1 // Triggers when 10% of the element is visible
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Add the 'visible' class to start the CSS transition (slide-down/fade-in)
                    entry.target.classList.add('visible');
                    // Stop observing the element once it has been revealed
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Start observing each element
        elementsToReveal.forEach(element => {
            observer.observe(element);
        });
    });
</script>
